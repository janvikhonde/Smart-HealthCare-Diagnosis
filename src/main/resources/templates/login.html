<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Healthcare</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Body & Fonts ===== */
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f4f8;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== Navbar ===== */
        .navbar {
            background: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .nav-brand {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0072ff;
        }

        .nav-links a {
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
            color: #0072ff;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #005fcc;
        }

        /* ===== Auth Container ===== */
        .auth-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .auth-box {
            background: #fff;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            width: 380px;
            text-align: center;
            position: relative;
        }

        .auth-box h2 {
            color: #0072ff;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        .auth-subtitle {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 2rem;
        }

        /* ===== Form ===== */
        .form-group {
            text-align: left;
            margin-bottom: 1.3rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem;
            border-radius: 10px;
            border: 1px solid #ccc;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            border-color: #0072ff;
            box-shadow: 0 0 8px rgba(0,114,255,0.3);
            outline: none;
        }

        /* ===== Submit Button ===== */
        .btn-submit {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,114,255,0.3);
        }

        /* ===== Auth Link ===== */
        .auth-link {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: #555;
        }

        .auth-link a {
            color: #0072ff;
            font-weight: 500;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        /* ===== Alerts ===== */
        .alert {
            padding: 0.8rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #ffe5e5;
            color: #d8000c;
        }

        .alert-success {
            background: #e5ffe5;
            color: #006400;
        }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        .auth-box {
            animation: fadeIn 0.8s ease-in-out;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">🏥 Smart Healthcare</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/signup">Sign Up</a>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-box">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Login to access your health dashboard</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <p class="auth-link">Don't have an account? <a href="/signup">Sign up here</a></p>
    </div>
</div>
</body>
</html>
